name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.0.4-mac.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Kept as a check on the tagged commit: the packages that get published are
  # the locally built, certificate-signed ones, never these ad-hoc CI artifacts.
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          sparse-checkout: README.md
          persist-credentials: false
      - name: Verify the release carries the locally signed packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-mac\.[0-9]+$ ]]
          VERSION="${TAG#v}"
          VERSION="${VERSION%-mac.*}"

          # Locally built packages are signed with the pinned certificate, so an
          # update keeps the Input Monitoring grant. CI builds are ad-hoc signed
          # and would reset that grant, therefore this workflow never creates a
          # release nor uploads an artifact: it only checks the release that was
          # prepared by hand from dist/.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            printf 'Release %s does not exist yet.\nCreate it first from the locally built packages, then re-run this workflow:\n' "$TAG" >&2
            printf '  gh release create %s dist/*.dmg dist/*.zip --title "Wuwa Tappo Mac 国服 / 国际服 %s" --notes-file /tmp/release-notes.md --latest\n' "$TAG" "$TAG" >&2
            exit 1
          fi

          EXISTING=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          MISSING=""
          for REGION in CN Global; do
            for EXT in dmg zip; do
              NAME="WuwaTappo-$REGION-Mac-$VERSION-arm64.$EXT"
              printf '%s\n' "$EXISTING" | grep -qxF "$NAME" || MISSING="$MISSING $NAME"
            done
          done
          if [ -n "$MISSING" ]; then
            printf 'Release %s is missing:%s\nUpload the locally built packages; CI artifacts are never published.\n' "$TAG" "$MISSING" >&2
            exit 1
          fi
          printf 'Release %s carries all four locally signed packages.\n' "$TAG"

          # The user-facing notes have a single source: README.md -> 版本更新.
          {
            awk -v version="$VERSION" '
              /^## 版本更新$/ { inside = 1; next }
              inside && /^## / { exit }
              inside && /^### / { if (started) exit; if (index($0, "### " version) == 1) started = 1 }
              inside && started { print }
            ' README.md
            printf '\n---\n\n'
            cat <<'NOTES'
          ## Wuwa Tappo · macOS 非官方重建版（国服 / 国际服）

          国服下载名称含 `CN` 的文件，国际服下载名称含 `Global` 的文件；两服应用、账号缓存和点击记录相互独立，可同时安装。

          下载 DMG 后将应用拖入“应用程序”，或解压 ZIP 后移动应用。两服安装包都包含各自官方界面、图像及运行资源，不需要 Windows、Wine 或手动提取 EXE。登录和联机仍需要连接对应地区的官方服务。

          - 支持 Apple Silicon，macOS 13 及以上。
          - 首次启动请按提示授权“输入监控”，用于按键和点击计数。
          - 当前使用临时签名，未进行 Apple 公证。系统可能要求在“隐私与安全性”中确认打开。
          - 包内不包含任何人的账号、登录凭据、点击记录或系统缓存。
          - 本项目由社区维护，不是库洛官方 Mac 客户端。随包的官方资源归原权利人所有；官方规则、账号和资产仍由官方服务决定。

          每服 ZIP 与 DMG 内容相同，共四个安装文件。安装包由维护者用固定证书在本地构建并签名，覆盖安装后无需重新授权输入监控；真人登录、系统权限及双人联机仍需实际验证。
          NOTES
          } > /tmp/release-notes.md

          gh release edit "$TAG" --notes-file /tmp/release-notes.md
